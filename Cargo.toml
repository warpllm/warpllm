[workspace]
resolver = "2"
members = [
    "crates/warpllm",
    "crates/warpllm-codegen",
    "crates/warpllm-server",
    "bindings/python",
    "bindings/node",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
warpllm = { path = "crates/warpllm" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: several providers' prompt caches are byte-sensitive; a
# BTreeMap-backed Map silently alphabetizes unknown fields in flight.
serde_json = { version = "1", features = ["preserve_order"] }
# The model registry is YAML on disk, compiled into the binary with
# `include_str!` and parsed once on first lookup. The upstream `serde_yaml` was
# archived in 2024; this is The YAML Organization's maintained continuation.
yaml_serde = "0.10.4"
# Binding metadata is optional on the published core. The non-published
# `warpllm-codegen` workspace tool is the only consumer.
#
# no-serde-warnings: ts-rs prints a compiler-looking warning for every serde
# attribute it cannot parse, and `deserialize_with` — how the streaming shapes
# tell an absent field from an explicit null — is one of them. It says nothing
# about the TypeScript shape, so the warning is noise on every build.
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
schemars = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
