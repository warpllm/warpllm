# Distributed as a Docker image; not published to crates.io (keeps
# release-crate.yml's single-crate publish untouched).
[package]
name = "warpllm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
warpllm.workspace = true
axum.workspace = true
clap.workspace = true
# `axum::response::Sse` wants a `Stream`; `warpllm::ChatCompletionStream` has an
# inherent `next()`. `stream::unfold` is the adapter, and keeping it here rather
# than in the core is what lets the core stay free of a futures dependency.
futures-util = { version = "0.3", default-features = false }
tower-http.workspace = true
tokio = { workspace = true, features = ["signal", "net"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest.workspace = true
wiremock = "0.6"
# The gateway's client reads provider keys from the environment, so the tests
# that reach an upstream have to set one; temp-env serializes the unsafe write.
temp-env = "0.3"
# Roster files for the `--specs` cases, which need a path that really exists.
tempfile = "3"
