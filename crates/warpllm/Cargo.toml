[package]
name = "warpllm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Warp-speed, self-hosted AI gateway: one OpenAI-compatible API across providers"
repository = "https://github.com/warpllm/warpllm"
readme = "../../README.md"
keywords = ["llm", "openai", "ai", "gateway", "anthropic"]
categories = ["api-bindings", "web-programming"]

[dependencies]
tokio.workspace = true
thiserror.workspace = true
reqwest.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[features]
# Adds schema/type metadata for the non-published workspace generator. It has
# no tests, file writes, environment variables, or repository-layout assumptions.
codegen = ["dep:ts-rs", "dep:schemars"]

[dev-dependencies]
wiremock = "0.6"
# A raw socket, for the one case a mock server cannot produce: a response that
# arrives and then goes quiet without closing. wiremock delays whole responses,
# which stalls the request before its headers instead.
tokio = { workspace = true, features = ["net", "io-util"] }
temp-env = "0.3"
# Examples only. warpllm emits `tracing` events and installs no subscriber of
# its own; the quickstart shows a caller opting in to see them.
tracing-subscriber.workspace = true
proptest = "1.11.0"
