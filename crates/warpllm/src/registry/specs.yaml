# warpllm's model registry: every provider and model warpllm can route to.
#
# This file is the whole roster — adding, changing, or removing an entry is an
# edit here and nowhere else. Run `cargo test -p warpllm` before opening a PR;
# a malformed or untidy roster fails there, and CI runs the same suite.
#
# Shape
# -----
#   providers:
#     openai:                                 # how the API is reached
#       base_url: "https://api.openai.com/v1"
#       env_api_key: OPENAI_API_KEY
#       models:
#         openai/gpt-5.6:                     # what is routable, and what it does
#           supported_apis:
#             - {api: openai_compat_chat_completions}
#           model: gpt-5.6-2026-01-01         # optional
#           capabilities:                     # optional
#             max_input_tokens: 400000
#
# A provider is a host; a model is a routable name under it. Nothing is
# inherited — not between the two levels, and not between models.
#
# Provider fields
# ---------------
#   base_url      Required. Any version prefix included, no trailing slash.
#   env_api_key   Optional. The environment variable holding the API key. Omit
#                 it if the provider has no key plumbing yet — a request routed
#                 there then fails saying exactly that.
#   models        The models routable under this provider.
#
# Model fields
# ------------
#   supported_apis    Required. Every surface this model serves, each written
#                     `- {api: <surface>}`. A model serves exactly what it
#                     lists.
#   model             Optional. The name sent upstream. Defaults to the key's
#                     last segment; set it when warpllm's alias differs from
#                     the provider's own name.
#   deprecation_date  Optional, `YYYY-MM-DD`. The day the provider stops
#                     serving this model, when one has been announced. Where a
#                     provider publishes two dates — the announcement, and the
#                     later day access ends — record the second: a deprecated
#                     model still answers, and the day routing to it breaks is
#                     the one worth having. Absent is the ordinary case and
#                     means nothing is scheduled, never that the model is
#                     permanent.
#
#                     Nothing acts on it: an entry keeps resolving past its
#                     date, and removing it is a deliberate edit. The value is
#                     taken as written and never checked against a calendar.
#
#                     Look for it on the provider's DEPRECATIONS page, not the
#                     model's own page. OpenAI's model pages say nothing about
#                     a retirement even when one is weeks away, so a new entry
#                     checked only against its model page will look healthy and
#                     be dead on arrival.
#   capabilities      Optional, and so is each limit in it: max_input_tokens,
#                     max_output_tokens, max_concurrent_requests.
#                     `max_input_tokens` is the provider's context window,
#                     taken verbatim. A provider's own "maximum input tokens"
#                     is usually the window minus its output ceiling; the
#                     window is what belongs here, since a completion may spend
#                     far fewer output tokens than the ceiling allows.
#
# Surfaces
# --------
# A surface name is `<protocol>_<endpoint>`, so it says which wire format it is
# spoken in — the only place this file records one. A provider entry names no
# protocol; its models do, once each per surface.
#
# Only list a surface warpllm implements. One it doesn't would load fine and
# then refuse the request.
#
#   openai_compat_chat_completions         One request, one whole reply.
#                                          IMPLEMENTED.
#   openai_compat_chat_completions_stream  The same, streamed as server-sent
#                                          events. IMPLEMENTED. Every provider
#                                          on the roster documents `stream` on
#                                          the endpoint rather than per model,
#                                          so it is listed for every model that
#                                          serves chat completions at all:
#                                          <https://developers.openai.com/api/reference/resources/chat>,
#                                          <https://api-docs.deepseek.com/api/create-chat-completion>,
#                                          <https://platform.kimi.ai/docs/api/chat>,
#                                          <https://openrouter.ai/docs/api-reference/streaming>
#                                          (all checked 2026-08-12).
#   openai_compat_responses                OpenAI's Responses API. Not
#                                          implemented yet.
#
# Rules the tests enforce
# -----------------------
# - Both maps stay in ascending key order: providers, and models within each.
# - A model key starts with the provider it sits under — `openai/gpt-5.6` under
#   `openai:`. The rest is the model name, and may contain further slashes.
# - Only listed models are routable, and there is no wildcard: `openai/*`
#   registers a model literally named `*`. An unlisted name is an error, never
#   a guess at what was meant.
# - Two providers may not share an `env_api_key`.
# - A model may not list the same surface twice.
# - Cite the provider's docs in a comment for anything you record. Undocumented
#   is not unlimited — omit a limit rather than guess it.

providers:
  # <https://api-docs.deepseek.com/api/create-chat-completion> (checked
  # 2026-07-24). The legacy `deepseek-chat` / `deepseek-reasoner` names were
  # discontinued 2026-07-24 and map to V4-Flash modes.
  #
  # Checked 2026-08-09: both V4 models share one context and output ceiling,
  # and differ only in concurrency. DeepSeek states the ceilings in rounded
  # units — "1M context", "MAXIMUM: 384K" output — so the decimal reading is
  # recorded, being the smaller of the two it could mean.
  # <https://api-docs.deepseek.com/quick_start/pricing/> — context and output
  # <https://api-docs.deepseek.com/quick_start/rate_limit> — concurrency, per
  # account rather than per key.
  deepseek:
    base_url: "https://api.deepseek.com"
    env_api_key: DEEPSEEK_API_KEY
    models:
      deepseek/deepseek-v4-flash:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1000000
          max_output_tokens: 384000
          max_concurrent_requests: 2500
      deepseek/deepseek-v4-pro:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1000000
          max_output_tokens: 384000
          max_concurrent_requests: 500

  # <https://platform.kimi.ai/docs/models> (checked 2026-08-11). The API is
  # OpenAI-compatible. The platform is branded Kimi while the host kept
  # Moonshot's name, which is why the two disagree below.
  # <https://platform.kimi.ai/docs/api/chat> — base URL and MOONSHOT_API_KEY
  #
  # Windows come from each model's PRICING page, which publishes the exact
  # figure; the model list rounds the same numbers to "1M" and "256k". Both
  # round down from a power of two, so the exact ones are what is recorded.
  #
  # No `max_concurrent_requests`: Kimi documents concurrency per account tier,
  # not per model. <https://platform.kimi.ai/docs/pricing/limits>
  #
  # No `max_output_tokens` on any entry: Kimi publishes no output ceiling for
  # any model. What the docs give is `max_completion_tokens`, the request
  # parameter — a default of 32,768, or 131,072 for kimi-k3, and for kimi-k3
  # an upper bound of 1,048,576 on what may be ASKED for. That is the range
  # the parameter accepts, described as "the length of tokens you expect us to
  # return", not a length the model is documented to reach.
  # <https://platform.kimi.ai/docs/api/chat>
  #
  # Deliberately absent, checked 2026-08-11:
  # - kimi-k2.5 and the whole moonshot-v1 series, `-vision-preview` variants
  #   included: no longer available to newly registered users, and sunset
  #   August 31 — the docs give the day without the year. Registering a model
  #   a new account cannot reach would fail every request made to it.
  # - Already discontinued: the kimi-k2 series (2026-05-25), kimi-latest
  #   (2026-01-28), kimi-thinking-preview (2025-11-11).
  kimi:
    base_url: "https://api.moonshot.ai/v1"
    env_api_key: MOONSHOT_API_KEY
    models:
      # <https://platform.kimi.ai/docs/pricing/chat-k26>
      kimi/kimi-k2.6:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 262144
      # <https://platform.kimi.ai/docs/pricing/chat-k27-code>
      kimi/kimi-k2.7-code:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 262144
      # The same limits as kimi-k2.7-code; the two differ in throughput.
      # <https://platform.kimi.ai/docs/pricing/chat-k27-code>
      kimi/kimi-k2.7-code-highspeed:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 262144
      # <https://platform.kimi.ai/docs/pricing/chat-k3>
      kimi/kimi-k3:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1048576

  # <https://developers.openai.com/api/docs/models/all> (checked 2026-08-11).
  # Every model below was confirmed on its own model page to mark
  # `v1/chat/completions` supported; each entry carries that page's link.
  #
  # They also serve the Responses API; it is left off until warpllm implements
  # that surface.
  #
  # The windows below are OpenAI's context windows. The "maximum input tokens"
  # shown beside each one is that window minus the model's output ceiling, so
  # it is not what these entries record.
  #
  # No `max_concurrent_requests` anywhere below: OpenAI documents throughput as
  # per-account tier rate limits, not a per-model ceiling on requests in
  # flight.
  #
  # Deliberately absent, each checked on its own model page 2026-08-11:
  # - Models whose page marks `v1/chat/completions` "Not supported" — they
  #   serve the Responses API instead: gpt-5-pro, gpt-5.2-pro, gpt-5.3-codex,
  #   gpt-5.4-pro, gpt-5.5-pro, o3-pro. Note the pinned `openai` SDK's
  #   `ChatModel` union disagrees and lists gpt-5.2-pro; the docs are the
  #   source of truth, and the SDK is only an oracle.
  # - Gated behind the Daybreak programme, and not on chat completions either:
  #   daybreak-blue-latest, daybreak-red-latest, gpt-5.6-cyber.
  # - Open-weight downloads rather than anything api.openai.com serves:
  #   gpt-oss-120b, gpt-oss-20b.
  # - Everything on a surface warpllm has no `api:` for: embeddings,
  #   moderation, images, audio, realtime, and legacy completions.
  # - Models already deprecated: gpt-4.1-nano and o4-mini both stop serving
  #   2026-10-23, and OpenAI names gpt-5.6-luna and gpt-5.6-terra as the
  #   replacements. Registering a name that breaks within the quarter would be
  #   handing callers a migration; both replacements are below. Neither model's
  #   own page mentions it — the deprecations page is the only place it
  #   appears.
  #   <https://developers.openai.com/api/docs/deprecations>
  # - chat-latest. It serves chat completions, but OpenAI moves the snapshot
  #   underneath it and points production traffic at GPT-5.6 instead, so the
  #   limits recorded here would go stale without the file changing.
  # - OpenAI's deprecated roster, and dated snapshots such as
  #   gpt-5-2025-08-07. The aliases below are what callers name.
  openai:
    base_url: "https://api.openai.com/v1"
    env_api_key: OPENAI_API_KEY
    models:
      # The 4.1 family, both sharing one pair of limits. The window is
      # 1,047,576 rather than a round million, and is recorded as published.
      # <https://developers.openai.com/api/docs/models/gpt-4.1>
      openai/gpt-4.1:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1047576
          max_output_tokens: 32768
      # <https://developers.openai.com/api/docs/models/gpt-4.1-mini>
      openai/gpt-4.1-mini:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1047576
          max_output_tokens: 32768
      # <https://developers.openai.com/api/docs/models/gpt-4o>
      openai/gpt-4o:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 128000
          max_output_tokens: 16384
      # <https://developers.openai.com/api/docs/models/gpt-4o-mini>
      openai/gpt-4o-mini:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 128000
          max_output_tokens: 16384
      # The GPT-5 family. These sort before the 5.1+ entries because `-`
      # (0x2D) precedes `.` (0x2E).
      # <https://developers.openai.com/api/docs/models/gpt-5>
      openai/gpt-5:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 400000
          max_output_tokens: 128000
      # <https://developers.openai.com/api/docs/models/gpt-5-mini>
      openai/gpt-5-mini:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 400000
          max_output_tokens: 128000
      # <https://developers.openai.com/api/docs/models/gpt-5-nano>
      openai/gpt-5-nano:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 400000
          max_output_tokens: 128000
      # <https://developers.openai.com/api/docs/models/gpt-5.1>
      openai/gpt-5.1:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 400000
          max_output_tokens: 128000
      # <https://developers.openai.com/api/docs/models/gpt-5.2>
      openai/gpt-5.2:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 400000
          max_output_tokens: 128000
      # 5.4 carries the larger window; its mini and nano do not.
      # <https://developers.openai.com/api/docs/models/gpt-5.4>
      openai/gpt-5.4:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1050000
          max_output_tokens: 128000
      # <https://developers.openai.com/api/docs/models/gpt-5.4-mini>
      openai/gpt-5.4-mini:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 400000
          max_output_tokens: 128000
      # <https://developers.openai.com/api/docs/models/gpt-5.4-nano>
      openai/gpt-5.4-nano:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 400000
          max_output_tokens: 128000
      # <https://developers.openai.com/api/docs/models/gpt-5.5>
      openai/gpt-5.5:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1050000
          max_output_tokens: 128000
      # The GPT-5.6 family, all three sharing one pair of limits. `gpt-5.6` is
      # OpenAI's alias for Sol rather than a model of its own, so it is
      # recorded with Sol's numbers.
      # <https://developers.openai.com/api/docs/models/gpt-5.6-sol>
      openai/gpt-5.6:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1050000
          max_output_tokens: 128000
      # <https://developers.openai.com/api/docs/models/gpt-5.6-luna>
      openai/gpt-5.6-luna:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1050000
          max_output_tokens: 128000
      # <https://developers.openai.com/api/docs/models/gpt-5.6-sol>
      openai/gpt-5.6-sol:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1050000
          max_output_tokens: 128000
      # <https://developers.openai.com/api/docs/models/gpt-5.6-terra>
      openai/gpt-5.6-terra:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 1050000
          max_output_tokens: 128000
      # The last o-series model here: o4-mini shuts down, and every `-pro`
      # sibling serves the Responses API instead.
      # <https://developers.openai.com/api/docs/models/o3>
      openai/o3:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        capabilities:
          max_input_tokens: 200000
          max_output_tokens: 100000

  # <https://openrouter.ai/docs/api-reference> (checked 2026-08-06).
  #
  # An aggregator, so each entry below is a curated pick from its catalog and
  # there is no `openrouter/*` catch-all. OpenRouter's own identifier is a
  # two-segment slug, which the key's last-segment default would truncate, so
  # every entry sets `model:` to the full slug. It publishes no per-slug
  # concurrency ceiling, only per-key rate limits on the caller's account.
  #
  # Take limits from `/api/v1/models/<slug>/endpoints`, and record the
  # NARROWEST any endpoint offers. A slug is not one model on one host: it
  # fans out across every provider serving those weights, and they disagree —
  # kimi-k2.6 alone runs across 21 endpoints whose max output spans 16,384 to
  # 262,144. An unpinned request may land on any of them, so the smallest
  # figure is the only one a caller can rely on, and a limit the endpoints
  # disagree about too widely is better omitted than promised.
  #
  # Do NOT read `top_provider` from `/api/v1/models`. It is one endpoint's
  # numbers, not the slug's, and it reads like a summary of them.
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    env_api_key: OPENROUTER_API_KEY
    models:
      # Checked 2026-08-07: 200K context, 32K max output.
      # <https://openrouter.ai/anthropic/claude-opus-4>
      openrouter/anthropic/claude-opus-4:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        model: anthropic/claude-opus-4
        capabilities:
          max_input_tokens: 200000
          max_output_tokens: 32000
      # Checked 2026-08-11, 5 endpoints, and they are two platforms counted
      # per region: Vertex serves a 1,000,000 window, Bedrock 200,000. An
      # unpinned request may get either, so 200,000 is what is recorded. All
      # five agree on 64,000 max output.
      # <https://openrouter.ai/api/v1/models/anthropic/claude-sonnet-4/endpoints>
      openrouter/anthropic/claude-sonnet-4:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        model: anthropic/claude-sonnet-4
        capabilities:
          max_input_tokens: 200000
          max_output_tokens: 64000
      # OpenRouter's alias for letting IT pick the model per request: the wire
      # name is the key's last segment, and the limits are whichever backend
      # it chooses.
      openrouter/auto:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
      # Checked 2026-08-07: 1M context, 65,536 max output.
      # <https://openrouter.ai/google/gemini-2.5-pro>
      openrouter/google/gemini-2.5-pro:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        model: google/gemini-2.5-pro
        capabilities:
          max_input_tokens: 1048576
          max_output_tokens: 65536
      # Kimi through the aggregator. Every figure below is the NARROWEST any
      # endpoint serving the slug offers, because an unpinned request may land
      # on any of them — see the note above the provider.
      #
      # Checked 2026-08-11, 21 endpoints: windows are 256,000 (StreamLake,
      # Venice), 262,000 (BaseTen) or 262,144, so 256,000 is what a caller can
      # count on. No max output: the endpoints span 16,384 (DeepInfra) to
      # 262,144, a sixteenfold spread with no model-level ceiling behind it.
      # <https://openrouter.ai/api/v1/models/moonshotai/kimi-k2.6/endpoints>
      openrouter/moonshotai/kimi-k2.6:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        model: moonshotai/kimi-k2.6
        capabilities:
          max_input_tokens: 256000
      # Checked 2026-08-11, 15 endpoints: windows are 256,000 or 262,144, and
      # max output spans 16,384 to 262,144. The `:batch` variant of this slug
      # is left off — it is OpenRouter's batch surface, not chat completions.
      # <https://openrouter.ai/api/v1/models/moonshotai/kimi-k2.7-code/endpoints>
      openrouter/moonshotai/kimi-k2.7-code:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        model: moonshotai/kimi-k2.7-code
        capabilities:
          max_input_tokens: 256000
      # Checked 2026-08-11, 13 endpoints. Moonshot's own window is 1,048,576
      # and most endpoints match it, but Sail Research serves 974,842 and
      # Together 1,000,000, so that is the figure recorded — the alternative
      # is promising a window a routed request may not get. Max output spans
      # 16,384 to 1,048,576.
      # <https://openrouter.ai/api/v1/models/moonshotai/kimi-k3/endpoints>
      openrouter/moonshotai/kimi-k3:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        model: moonshotai/kimi-k3
        capabilities:
          max_input_tokens: 974842
      # Checked 2026-08-07: `gpt-5.6` is OpenAI's alias for `gpt-5.6-sol`, so
      # these are Sol's limits — 1M context, 128K max output.
      # <https://openrouter.ai/openai/gpt-5.6-sol>
      openrouter/openai/gpt-5.6:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        model: openai/gpt-5.6
        capabilities:
          max_input_tokens: 1050000
          max_output_tokens: 128000
      # Checked 2026-08-09: the `~deepseek/…-latest` alias, always the newest
      # DeepSeek V4 Flash revision — 1,048,576 context, which every member of
      # the family shares, so the alias cannot resolve to something narrower.
      # No max output: OpenRouter publishes none for the alias, and the
      # revisions behind it disagree (384,000 and 393,216).
      # <https://openrouter.ai/~deepseek/deepseek-v4-flash-latest>
      openrouter/~deepseek/deepseek-v4-flash-latest:
        supported_apis:
          - {api: openai_compat_chat_completions}
          - {api: openai_compat_chat_completions_stream}
        model: ~deepseek/deepseek-v4-flash-latest
        capabilities:
          max_input_tokens: 1048576
